{% extends "layout.html" %}

{% block main %}
<div class="page-content">
  <div class="auth-logo-top-left">
    <img
      src="{{ url_for('static', filename='logo.png') }}"
      alt="Family Forest"
    >
  </div>
  
  <div class="custom-wrapper-lg">
    <div class="custom-card mb-4">
      <form action="/add-relationship" method="post" class="custom-form">

        <a href="/" class="home-btn">
            ← Forest
        </a>

        <h2 class="custom-title mb-4 text-center">
          Add a branch to your forest
        </h2>

        <div class="row g-4 mb-4">
          <div class="col-12">
            <label for="relationship" class="form-label">Relationship type</label>
            <select
                class="form-select form-select-lg custom-select"
                id="relationship"
                name="relationship"
                rows="4"
                placeholder="Spouse"
                >
                {% for relationship in relationships %}
                    <option>{{relationship}}</option>
                {% endfor %}
            </select>
          </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6">
            <label class="form-label">Person A</label>

            <input
                type="text"
                id="personASearch"
                class="form-control form-control-lg mb-2"
                placeholder="Search person A…"
            >

            <select
                class="form-select form-select-lg custom-select"
                id="personA"
                name="personA"
            >
                <option disabled selected>Person A</option>
                {% for person in people %}
                    <option value="{{person.id}}">{{person.id}} - {{person.name}}</option>
                {% endfor %}
            </select>
            </div>


            <div class="col-md-6">
            <label class="form-label">Person B</label>

            <input
                type="text"
                id="personBSearch"
                class="form-control form-control-lg mb-2"
                placeholder="Search person B…"
            >

            <select
                class="form-select form-select-lg custom-select"
                id="personB"
                name="personB"
            >
                <option disabled selected>Person B</option>
                {% for person in people %}
                    <option value="{{person.id}}">{{person.id}} - {{person.name}}</option>
                {% endfor %}
            </select>
            </div>
        </div>

        {% if error %}
        <div class="alert custom-alert mb-4" role="alert">
          {{ error }}
        </div>
        {% endif %}

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            Add person
          </button>
        </div>

      </form>
    </div>

    <div class="custom-card-sm mb-4">
      <p id="relationship-preview" class="text-center fs-5 text-muted">
        Mr. Duck is Mrs's Duck spouse.
      </p>
    </div>


  </div>
</div>

<script>
  const personA = document.getElementById("personA");
  const personB = document.getElementById("personB");
  const relationship = document.getElementById("relationship");
  const preview = document.getElementById("relationship-preview");

  function extractFirstName(select) {
    const text = select.options[select.selectedIndex].text;
    // "ID - Full Name"
    const fullName = text.split(" - ").slice(1).join(" - ");
    // First word = first name
    return fullName.trim().split(" ")[0];
  }

  function updatePreview() {
    if (!personA.value || !personB.value || !relationship.value) {
      preview.textContent = "Select people and a relationship";
      return;
    }

    const nameA = extractFirstName(personA);
    const nameB = extractFirstName(personB);
    const verb = relationship.value;

    preview.textContent = `${nameA} is the ${verb} of ${nameB}`;
  }

  personA.addEventListener("change", updatePreview);
  personB.addEventListener("change", updatePreview);
  relationship.addEventListener("change", updatePreview);
</script>

<script>
  function attachFilter(inputId, selectId) {
    const input = document.getElementById(inputId);
    const select = document.getElementById(selectId);

    if (!input || !select) return;

    input.addEventListener("input", function () {
      const filter = this.value.toLowerCase();

      for (const option of select.options) {
        if (!option.value) continue; // skip placeholder

        const text = option.text.toLowerCase();
        option.hidden = !text.includes(filter);
      }
    });
  }

  attachFilter("personASearch", "personA");
  attachFilter("personBSearch", "personB");
</script>


{% endblock %}
