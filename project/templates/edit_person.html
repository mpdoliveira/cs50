{% extends "layout.html" %}

{% block main %}
<div class="page-content">

    <div class="auth-logo-top-left">
    <img
      src="{{ url_for('static', filename='logo.png') }}"
      alt="Family Forest"
    >
  </div>
  
  <div class="custom-wrapper-lg">

    <div class="custom-card">
        {% if person %}
            <form action="/edit-person/{{person.id}}" method="post" class="custom-form">

                <a href="/" class="home-btn">
                    ← Forest
                </a>

                <h2 class="custom-title mb-4 text-center">
                Leaves must change colors
                </h2>

                <!-- Row 1 -->
                <div class="row g-4 mb-3">
                    <div class="col-md-8">
                        <label for="name" class="form-label">Name</label>
                        <input
                            class="form-control form-control-lg"
                            id="name"
                            name="name"
                            value="{{person.name}}"
                            type="text">
                    </div>

                    <div class="col-md-4">
                        <label for="birthdate" class="form-label">Birth date</label>
                        <input
                            class="form-control form-control-lg"
                            id="birthdate"
                            name="birthdate"
                            value="{{person.birth_date}}"
                            type="date">
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="row g-4 mb-4">
                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea
                        class="form-control form-control-lg"
                        id="notes"
                        name="notes"
                        rows="4"
                        >{{person.notes}}</textarea>
                </div>
                </div>

                {% if error %}
                <div class="alert custom-alert mb-4" role="alert">
                {{ error }}
                </div>
                {% endif %}

                <div class="row">
                    <div class="col">
                        <button  class="btn btn-primary btn-lg w-100" name="action" type="submit" value="save">
                            Save edits
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger btn-lg w-100" name="action" type="submit"  value="delete">
                            Delete person
                        </button>
                    </div>
                </div>

            </form>
        {% else %}
            <form action="/edit-person" method="post" class="custom-form">
                <a href="/" class="home-btn">
                    ← Forest
                </a>

                <h2 class="custom-title mb-4 text-center">
                    Who do you want to edit?
                </h2>

                <input
                type="text"
                id="personSearch"
                class="form-control form-control-lg mb-3"
                placeholder="Search person by name…"
                >

                <select
                    class="form-select form-select-lg custom-select mb-4"
                    id="personSelect"
                    name="person_id"
                    >
                    <option autofocous disabled selected>Person</option>
                    {% for p in people %}
                        <option value="{{p.id}}">{{p.id}} - {{p.name}}</option>
                    {% endfor %}
                </select>

                {% if error %}
                <div class="alert custom-alert mb-4" role="alert">
                {{ error }}
                </div>
                {% endif %}

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg w-100" name="action" type="submit"  value="edit">
                        Edit person
                    </button>
                </div>
            </form>
        {% endif %}
    </div>

  </div>
</div>

<script>
  const searchInput = document.getElementById("personSearch");
  const select = document.getElementById("personSelect");

  searchInput.addEventListener("input", function () {
    const filter = this.value.toLowerCase();

    for (const option of select.options) {
      if (!option.value) continue;

      const text = option.text.toLowerCase();
      option.hidden = !text.includes(filter);
    }
  });
</script>


{% endblock %}
