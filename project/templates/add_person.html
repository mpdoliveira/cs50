{% extends "layout.html" %}

{% block main %}
<div class="page-content">

  <div class="auth-logo-top-left">
    <img
      src="{{ url_for('static', filename='logo.png') }}"
      alt="Family Forest"
    >
  </div>
  
  <div class="custom-wrapper-lg">

    <div class="custom-card">
      <form action="/add-person" method="post" class="custom-form">

        <a href="/" class="home-btn">
            ← Forest
        </a>

        <h2 class="custom-title mb-4 text-center">
          Add a leaf to your forest
        </h2>

        <!-- Row 1 -->
        <div class="row g-4 mb-3">
            <div class="col-md-8">
                <label for="name" class="form-label">Name</label>
                <input
                    class="form-control form-control-lg"
                    id="name"
                    name="name"
                    type="text">
            </div>

            <div class="col-md-4">
                <label for="birthdate" class="form-label">Birth date</label>
                <input
                    class="form-control form-control-lg"
                    id="birthdate"
                    name="birthdate"
                    type="date">
            </div>
        </div>

        <!-- Row 2 -->
        <div class="row g-4 mb-4">
          <div class="col-12">
            <label for="notes" class="form-label">Notes</label>
            <textarea
                class="form-control form-control-lg"
                id="notes"
                name="notes"
                rows="4"
                placeholder="Add notes, stories, or relevant details..."
                ></textarea>
          </div>
        </div>

        {% if error %}
        <div class="alert custom-alert mb-4" role="alert">
          {{ error }}
        </div>
        {% endif %}

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            Add person
          </button>
        </div>

      </form>
    </div>

  </div>
</div>

{% endblock %}
