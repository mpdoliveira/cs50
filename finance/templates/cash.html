{% extends "layout.html" %}

{% block title %}
    Buy
{% endblock %}

{% block main %}

    <form action="/cash" method="post">
        <div class="mb-3">
            Cash: {{cash}}
        </div>
        <div class="mb-3">
            <input autofocus class="form-control mx-auto w-auto" min="0.01" name="value" placeholder="Value" required type="numeric">
        </div>
        <div class="mb-3">
            <select class="form-select mx-auto w-auto" name="type" required>
                <option value="deposit">Deposit</option>
                <option value="withdraw">Withdraw</option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Execute</button>
    </form>

{% endblock %}
