<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <title>Bouganvilla</title>
    </head>
    <body>
        <header class="py-3">
            <div class="container text-center">
                <img alt="Bouganvilla logo" class="img-fluid" style="max-height: 150px;" src="images/bouganvilla_logo.png">
                <ul class="nav justify-content-center">
                    <a class="nav-link mx-3" href="index.html">Home</a>
                    <a class="nav-link mx-3" href="booking.html">Booking</a>
                    <a class="nav-link mx-3" href="album.html">Album</a>
                    <a class="nav-link mx-3" href="our_story.html">Our Story</a>
                </ul>
            </div>
        </header>
        <div class="container my-4">
            <div class="card shadow p-4 rounded-4 border-0">
                <h4 class="mb-4 text-center fw-semibold">Availability</h4>
                <table class="table table-bordered text-center align-middle mb-0 table-hover">
                    <thead class="table-light">
                        <tr>
                        <th>Sun</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                        <td></td><td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td>
                        </tr>
                        <tr>
                        <td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td>
                        </tr>
                        <tr>
                        <td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td>
                        </tr>
                        <tr>
                        <td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td>
                        </tr>
                        <tr>
                        <td>27</td><td>28</td><td>29</td><td>30</td><td>31</td><td></td><td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="container pb-4" style="max-width: 480px;">
            <div class="card shadow p-4 rounded-4 border-0">

                <h4 class="mb-4 text-center fw-semibold">Book Your Stay</h4>

                <div class="mb-3">
                    <label for="full-name" class="form-label">Full Name</label>
                    <input type="text" class="form-control form-control-lg rounded-3"
                        id="full-name" placeholder="Carolina R. Bhering" autofocus>
                </div>

                <div class="mb-3">
                    <label for="book-date" class="form-label">Date</label>
                    <input type="date" class="form-control form-control-lg rounded-3" id="book-date">
                </div>

                <div class="mb-3">
                    <label for="tel" class="form-label">Phone</label>
                    <input type="tel" class="form-control form-control-lg rounded-3"
                        id="tel" placeholder="+55 32 9 1234-5678">
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control form-control-lg rounded-3"
                        id="email" placeholder="bouganvilla@cs50.com">
                </div>

                <button type="submit" class="btn btn-dark btn-lg w-100 rounded-3">
                    Book Now
                </button>

            </div>
        </div>


    <script src="backend.js"></script>
    </body>
</html>
